version: '3.7'

services:
  orderer.example.com:
    container_name: orderer.example.com
    image: hyperledger/fabric-orderer:2.5.4
    environment:
      - FABRIC_LOGGING_SPEC=INFO
      - ORDERER_GENERAL_LISTENADDRESS=0.0.0.0
      - ORDERER_GENERAL_LISTENPORT=7050
      - ORDERER_GENERAL_LOCALMSPID=SampleOrg
      - ORDERER_GENERAL_LOCALMSPDIR=/etc/hyperledger/msp
      - ORDERER_GENERAL_BCCSP_DEFAULT_PROVIDER=SW
      # Use the 'solo' consensus for a single node (deprecated in prod, fine for dev)
      - ORDERER_GENERAL_GENESISMETHOD=provisional
      - ORDERER_GENERAL_PROFILE=SampleSingleMSPSoloV1_1
    volumes:
      - ./msp:/etc/hyperledger/msp
    ports:
      - 7050:7050

  peer0.org1.example.com:
    container_name: peer0.org1.example.com
    image: hyperledger/fabric-peer:2.5.4
    environment:
      - CORE_PEER_ID=peer0.org1.example.com
      - CORE_PEER_ADDRESS=peer0.org1.example.com:7051
      - CORE_PEER_LISTENADDRESS=0.0.0.0:7051
      - CORE_PEER_CHAINCODEADDRESS=peer0.org1.example.com:7052
      - CORE_PEER_CHAINCODELISTENADDRESS=0.0.0.0:7052
      - CORE_PEER_LOCALMSPID=SampleOrg
      - CORE_PEER_MSPCONFIGPATH=/etc/hyperledger/msp
      - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock
      - CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE=blockchain_default
      - FABRIC_LOGGING_SPEC=INFO
      - CORE_PEER_CHAINCODELOGGING_LEVEL=INFO
      - CORE_PEER_CHAINCODELOGGING_FORMAT=%{color}%{time:2006-01-02 15:04:05.000 MST} [%{module}] %{shortfunc} -> %{level:.4s} %{id:03x}%{color:reset} %{message}
    volumes:
      - /var/run/docker.sock:/host/var/run/docker.sock
      - ./msp:/etc/hyperledger/msp
    ports:
      - 7051:7051
      - 7052:7052
    depends_on:
      - orderer.example.com

  fabric-cli:
    container_name: fabric-cli
    image: hyperledger/fabric-tools:2.5.4
    tty: true
    stdin_open: true
    environment:
      - GOPATH=/opt/gopath
      - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock
      - FABRIC_LOGGING_SPEC=INFO
      - CORE_PEER_ID=fabric-cli
      - CORE_PEER_ADDRESS=peer0.org1.example.com:7051
      - CORE_PEER_LOCALMSPID=SampleOrg
      - CORE_PEER_MSPCONFIGPATH=/etc/hyperledger/msp
    working_dir: /opt/gopath/src/chaincode
    volumes:
      - /var/run/docker.sock:/host/var/run/docker.sock
      - ./msp:/etc/hyperledger/msp
      - ./chaincode:/opt/gopath/src/chaincode
    depends_on:
      - peer0.org1.example.com

  blockchain-api:
    container_name: praman_blockchain_api
    build:
      context: ./api
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - fabric-cli
